name: ci

# Required status checks match on the job id, so the jobs below keep no `name:`
# override: a ruleset on develop can require "host-tests" and "build" verbatim.
# No `paths:` filter either, because a required check that never runs leaves the
# PR waiting forever.
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR supersedes the run in progress. Pushes to develop and
# manual runs get a group of their own (the run id): sharing one group would
# still let Actions drop a queued run when a third one arrives, even with
# cancel-in-progress off, and every commit on develop should keep its verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    # Explicit `bash` makes Actions run with -eo pipefail instead of plain -e.
    shell: bash

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Do not set CFLAGS anywhere in this workflow: every test_host/Makefile
      # assigns it with `?=`, so an inherited value would silently drop ASan and
      # UBSan and the suites would still pass.
      - name: Host test suites (ASan + UBSan)
        run: |
          cc --version | head -n 1

          # Discovered rather than listed, so a component that adds a
          # test_host/ on another branch is covered without touching this file.
          shopt -s nullglob
          suites=(components/*/test_host)
          if [ "${#suites[@]}" -eq 0 ]; then
            # An empty glob would otherwise pass without running anything.
            echo "::error::no components/*/test_host directory found"
            exit 1
          fi

          # Run every suite before failing, so one red PR shows all the
          # broken components at once instead of only the first.
          failed=()
          for d in "${suites[@]}"; do
            echo "::group::$d"
            if ! make -C "$d"; then
              failed+=("$d")
            fi
            echo "::endgroup::"
          done

          if [ "${#failed[@]}" -ne 0 ]; then
            for d in "${failed[@]}"; do
              echo "::error::host tests failed in $d"
            done
            exit 1
          fi
          echo "${#suites[@]} host test suites passed"

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: idf.py build (ESP-IDF v5.5.2, esp32)
        uses: espressif/esp-idf-ci-action@v1
        with:
          # Pinned, never `latest` (the action's default). IDF v6 dropped the
          # json and mqtt components that web_server and mqtt_manager require,
          # and log_ring.c stops the build with #error unless the IDF defaults
          # keep log version 1 and RTOS timestamps, which sdkconfig.defaults
          # does not pin. A bump goes in its own PR, built here first.
          esp_idf_version: v5.5.2
          target: esp32
          command: idf.py build
