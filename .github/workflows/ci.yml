name: ci

# Required status checks match on the job id, so the jobs below keep no `name:`
# override: a ruleset on develop or main can require "host-tests" and "build"
# verbatim. No `paths:` filter either, because a required check that never runs
# leaves the PR waiting forever. For the same reason main is listed next to
# develop: the release PR from develop into main must run the checks its
# ruleset requires, and a branch dropped from these lists must not be required.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR supersedes the run in progress. Pushes to develop or main
# and manual runs get a group of their own (the run id): sharing one group would
# still let Actions drop a queued run when a third one arrives, even with
# cancel-in-progress off, and every commit on those branches should keep its
# verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # CFLAGS stays unset: the Makefiles use ?= and an inherited value drops the sanitizers.
      - run: for d in components/*/test_host; do make -C "$d" || exit 1; done

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: idf.py build, warnings fail (ESP-IDF v5.5.2, esp32)
        uses: espressif/esp-idf-ci-action@v1
        with:
          # Pinned, never `latest` (the action's default). IDF v6 dropped the
          # json and mqtt components that web_server and mqtt_manager require,
          # and log_ring.c stops the build with #error unless the IDF defaults
          # keep log version 1 and RTOS timestamps, which sdkconfig.defaults
          # does not pin. A bump goes in its own PR, built here first.
          esp_idf_version: v5.5.2
          target: esp32
          # IDF builds with -Werror but downgrades unused-function,
          # unused-variable, unused-but-set-variable, deprecated-declarations
          # and all of -Wextra back to warnings, so a clean exit still lets them
          # through. The firmware builds with none, and the log is grepped to
          # keep it that way; idf.py strips color codes when its output is a
          # pipe, so the match is plain text.
          # The action pastes this command inside `bash -c '...'`: a single
          # quote would end that string early, so only double quotes appear
          # here. That shell also runs without pipefail, which would let the
          # exit status of tee hide a failed build.
          command: >-
            set -o pipefail &&
            idf.py build 2>&1 | tee /tmp/build.log &&
            if grep -n "warning:" /tmp/build.log; then
            echo "::error::the firmware build emitted compiler warnings";
            exit 1;
            fi
